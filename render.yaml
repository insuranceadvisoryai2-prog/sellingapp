# render.yaml — drop this in your repo root
# Render reads it automatically when you connect the repo

services:
  - type: web
    name: ecommerce-api
    runtime: dotnet
    plan: free                         # upgrade to starter for always-on
    buildCommand: dotnet publish -c Release -o ./publish
    startCommand: dotnet ./publish/ECommerce.dll
    healthCheckPath: /health

    envVars:
      # Set these in Render dashboard → Environment (never commit real values)
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        sync: false       # fill in Render dashboard
      - key: JWT_SECRET_KEY
        sync: false       # fill in Render dashboard (64+ random chars)
      - key: AllowedOrigins__0
        value: https://your-app.vercel.app
